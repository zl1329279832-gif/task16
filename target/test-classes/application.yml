spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cs.alloc.domain
  configuration:
    map-underscore-to-camel-case: true

cs:
  queue:
    timeout-seconds: 1800
    vip-weight: 10
    wait-weight: 1
  agent:
    reconnect-grace-seconds: 30
    heartbeat-interval: 10
  session:
    idle-timeout-seconds: 300
  allocation:
    interval-ms: 999999999
    skill-match-score: 50
    load-penalty: 10
  sla:
    default-timeout-seconds: 1800
    vip-timeout-multiplier: 0.5
    risk-scan-interval-ms: 999999999
    snapshot-interval-ms: 999999999
    medium-threshold: 30
    high-threshold: 60
    critical-threshold: 85
    avg-handle-seconds: 300
    fallback-skill-group-id: 1
  mq:
    type: memory
