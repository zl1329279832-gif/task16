server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cs_alloc?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cs.alloc.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

cs:
  queue:
    timeout-seconds: 1800
    vip-weight: 10
    wait-weight: 1
  agent:
    reconnect-grace-seconds: 30
    heartbeat-interval: 10
  session:
    idle-timeout-seconds: 300
  allocation:
    interval-ms: 2000
    skill-match-score: 50
    load-penalty: 10
  mq:
    type: memory

logging:
  level:
    com.cs.alloc: DEBUG
    org.mybatis: DEBUG
