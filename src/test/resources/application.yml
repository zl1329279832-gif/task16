spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cs.alloc.domain
  configuration:
    map-underscore-to-camel-case: true

cs:
  queue:
    timeout-seconds: 1800
    vip-weight: 10
    wait-weight: 1
  agent:
    reconnect-grace-seconds: 30
    heartbeat-interval: 10
  session:
    idle-timeout-seconds: 300
  allocation:
    interval-ms: 999999999
    skill-match-score: 50
    load-penalty: 10
  mq:
    type: memory
  sla:
    enabled: true
    interval-ms: 999999999
    vip-weight: 25.0
    wait-weight: 0.5
    availability-weight: 20.0
    load-weight: 15.0
    aht-multiplier: 0.1
    heartbeat-penalty: 30.0
    risk-threshold: 75.0
    degradation-timeout-seconds: 600
    snapshot-interval-seconds: 30
    pinned-ttl-seconds: 3600
    snapshot-ttl-seconds: 300
    fallback-skill-groups:
      1: 99
      2: 99
      3: 98
